<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My Development Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5f1;--surface:#fff;--surface-2:#eaeee6;--line:#d3dacd;--fg:#18231c;--muted:#5b6a5f;--accent:#1f6b3a;--accent-fg:#fff;--ball:#a4161a;--warn-soft:#fbecd2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--r:8px}
@media (prefers-color-scheme: dark){:root{--bg:#111814;--surface:#18211b;--surface-2:#202b24;--line:#2f3d33;--fg:#e5ece6;--muted:#9aab9e;--accent:#5cbf7d;--accent-fg:#0d1a11;--ball:#f07a7d;--warn-soft:#3a2c14;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:#1d3557;color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:calc(env(safe-area-inset-top,0px) + 12px);font-family:var(--display);font-size:19px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0;z-index:2}
.body{max-width:640px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}h2{font-size:30px}
.lead{margin:0;color:var(--muted)}
.q{display:grid;gap:14px}
label.f{display:grid;gap:5px;font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;font-weight:400}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.checks{display:grid;gap:8px;margin-top:4px}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}.prog div{height:100%;background:var(--accent)}
.stepn{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:-8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 20px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.6}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.scale button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rates{display:grid;gap:14px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rl{font-weight:600;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.scale button{height:42px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.alert{background:var(--warn-soft);border-radius:6px;padding:10px 12px}
.note{font-size:13.5px;color:var(--muted)}

:root{--s1:#1f7a3f;--s2:#1d4f91;--s3:#c77700;--s4:#a4161a;--s5:#6b3fa0;--s6:#0f7c80;--s7:#8a5a00;--s8:#b03a78}
@media (prefers-color-scheme: dark){:root{--s1:#6fd193;--s2:#7fa8ec;--s3:#f0b35a;--s4:#f07a7d;--s5:#c49bf0;--s6:#5fd0d4;--s7:#e0b860;--s8:#f08cc0}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
h3{font-family:var(--display);font-size:22px;margin:0;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.legend{gap:8px}.lg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;text-align:left}.lg[aria-pressed="false"]{opacity:.6}.lg i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;box-sizing:border-box}.lg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.goal{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}.goal:first-of-type{border-top:0;padding-top:0}
.acts{margin:0;padding:0;list-style:none;display:grid;gap:4px}.acts li{display:flex;gap:8px}.acts .tick{width:18px;flex:none;color:var(--accent);font-weight:700}
.sess{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}.sess:first-of-type{border-top:0;padding-top:0}
details.sess summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:4px 12px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;white-space:pre-wrap}
.q{display:grid;gap:14px}
.good{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding:10px 12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/shared.js"></script>
</head>
<body>
<div class="top" id="top">My development plan</div>
<main class="body" id="app"><p class="lead">Loading…</p></main>
<script>
(function(){
"use strict";
const cfg=window.APP_CONFIG||{};
document.getElementById("top").textContent=(cfg.clubName||"Cricket club")+" · my development plan";
const code=(new URLSearchParams(location.hash.slice(1)).get("r")||"").trim();
const sb=cfg.supabaseUrl&&!/YOUR-PROJECT/.test(cfg.supabaseUrl)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,code?{auth:{persistSession:false,detectSessionInUrl:false}}:{}):null;
const authMode=!code;let user=null,plans=[],pid=null,auth={tab:"in",msg:"",busy:false,recovery:false};
const here=()=>location.origin+location.pathname;
const app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{if(!d)return"";const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
const COLORS=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];let on=null;
let R=null,mode="overview",editing=false,draft=null,saving=false,msg="";
const PROFILE_Q=[["batHand","How do you bat?",{select:["Right-handed","Left-handed"]}],["batPosition","Where do you like to bat?",{select:["Opener","Top order (3-4)","Middle order (5-6)","Lower order (7+)","No preference"]}],["bowlArm","Which arm do you bowl with?",{select:["Right-arm","Left-arm","Doesn't bowl"]}],["bowlType","What type of bowler are you?",{select:BOWL_TYPES}],["keeper","Do you keep wicket?",{select:["Yes","No"]}],["role","What's your main role?",{select:["Batter","Bowler","Batting all-rounder","Bowling all-rounder","Wicket-keeper batter"]}],["seasons","How many seasons have you played?",{type:"number"}],["clubs","Clubs, schools or squads you've played for",{}],["highestLevel","Highest level you've played",{}],["otherSports","Other sports you play",{area:1}],["ambitionSeason","What do you want to achieve this season?",{area:1}],["ambitionLong","Where would you like your cricket to be in two or three years?",{area:1}],["enjoy","What do you enjoy most when you play?",{area:1}],["improve","What's the one thing you most want to get better at?",{area:1}],["learn","How do you learn best?",{area:1}]];
const FMTS=[["hard","Hardball"],["soft","Softball"],["t20","T20"],["sat","Saturday League"],["sun","Sunday"],["twoday","2-day"],["county","County age group"]];
const SHORT={batHand:"Bats",batPosition:"Batting position",bowlArm:"Bowls",bowlType:"Bowler type",keeper:"Keeps wicket",role:"Main role",seasons:"Seasons played",clubs:"Clubs and squads",highestLevel:"Highest level",otherSports:"Other sports",ambitionSeason:"This season",ambitionLong:"In 2 to 3 years",enjoy:"Enjoys most",improve:"Most wants to improve",learn:"Learns best by"};
function field(k,label,o){const v=draft.profile[k]??"",id="pf-"+k;
  if(o.area)return `<label class="f" for="${id}">${esc(label)}<textarea id="${id}" data-pk="${k}" maxlength="1500">${esc(v)}</textarea></label>`;
  if(o.select)return `<label class="f" for="${id}">${esc(label)}<select id="${id}" data-pk="${k}"><option value="">Choose…</option>${o.select.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
  return `<label class="f" for="${id}">${esc(label)}<input id="${id}" type="${o.type||"text"}" data-pk="${k}" value="${esc(v)}" maxlength="300" ${o.type==="number"?'inputmode="numeric" min="0" max="60"':""}></label>`}
function profileCard(){const P=R.profile||{};
  if(editing){return `<section class="card" id="prof"><h3>Edit my profile</h3><p class="note" style="margin:0">Changes go straight to your coach.</p><div class="q">${PROFILE_Q.filter(([k])=>!(k==="bowlType"&&draft.profile.bowlArm==="Doesn't bowl")).map(([k,l,o])=>field(k,l,o)).join("")}
    <div class="f">Which formats have you played?<div class="checks">${FMTS.map(([k,l])=>`<label class="check"><input type="checkbox" data-fmt="${k}" ${(draft.profile.fmt||{})[k]?"checked":""}><span>${esc(l)}</span></label>`).join("")}</div></div>
    <label class="f" for="pf-health">Any new injury or health update for your coach? (optional)<textarea id="pf-health" data-health="1" maxlength="1500" placeholder="e.g. Sore side after Saturday's game">${esc(draft.health||"")}</textarea></label>
    <p class="note" style="margin:-6px 0 0">Your coach sees this, but it isn't shown back on this page.</p></div>
    ${msg?`<div class="alert">${esc(msg)}</div>`:""}
    <div class="nav"><button class="btn" type="button" data-pa="cancel">Cancel</button><button class="btn primary" type="button" data-pa="save" ${saving?"disabled":""}>${saving?"Saving…":"Save changes"}</button></div></section>`}
  const fm=FMTS.filter(([k])=>(P.fmt||{})[k]).map(x=>x[1]).join(", ");
  const rows=Object.keys(SHORT).filter(k=>P[k]!==""&&P[k]!=null&&!(k==="bowlType"&&P.bowlArm==="Doesn't bowl")).map(k=>`<dt>${esc(SHORT[k])}</dt><dd>${esc(P[k])}</dd>`).join("")+(fm?`<dt>Formats</dt><dd>${esc(fm)}</dd>`:"");
  return `<section class="card" id="prof"><div class="nav" style="margin:0;align-items:center"><h3>My profile</h3><button class="btn" type="button" data-pa="edit" style="padding:8px 14px">Edit</button></div>${msg?`<div class="good">${esc(msg)}</div>`:""}${rows?`<dl class="kv">${rows}</dl>`:`<p class="note" style="margin:0">Nothing here yet. Tap Edit to tell your coach about your cricket.</p>`}</section>`}
function sessionsCard(){const S=(R.sessions||[]).slice().sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));if(!S.length)return`<section class="card"><h3>My training sessions</h3><p class="note" style="margin:0">Your coach hasn't planned any sessions for you yet.</p></section>`;
  const td=new Date().toISOString().slice(0,10);const up=S.filter(x=>!x.date||x.date>=td),past=S.filter(x=>x.date&&x.date<td).reverse();
  const body=x=>`${x.goals.length?`<div><span class="pill">Works on goal${x.goals.length>1?"s":""} ${x.goals.join(", ")}</span></div>`:""}${x.focus?`<div>${esc(x.focus)}</div>`:""}${x.objs.length?`<div><b>By the end you should be able to:</b><ul class="acts">${x.objs.map(o=>`<li><span class="tick">•</span><span>${esc(o)}</span></li>`).join("")}</ul></div>`:""}${[["fixed","Fixed practice"],["dynamic","Dynamic practice"],["scenario","Scenario practice"]].filter(([k])=>x[k]).map(([k,l])=>`<div><b>${l}:</b> ${esc(x[k])}</div>`).join("")}${x.equipment?`<div class="note">Equipment: ${esc(x.equipment)}</div>`:""}`;
  const head=x=>`Session ${x.n}${x.date?" · "+esc(fmt(x.date)):""}${x.time?" · "+esc(x.time):""}`;
  const sub=x=>[x.type,x.duration?x.duration+" min":"",x.venue,x.coach?"with "+x.coach:""].filter(Boolean).map(esc).join(" · ");
  return `<section class="card"><h3>My training sessions</h3>${up.length?up.map(x=>`<div class="sess"><b>${head(x)}</b>${sub(x)?`<div class="note">${sub(x)}</div>`:""}${body(x)}</div>`).join(""):`<p class="note" style="margin:0">No sessions coming up yet.</p>`}
   ${past.map(x=>`<details class="sess"><summary>${head(x)} (done)</summary><div style="display:grid;gap:6px;margin-top:6px">${sub(x)?`<div class="note">${sub(x)}</div>`:""}${body(x)}</div></details>`).join("")}</section>`}
function wrap(t,max){const w=String(t).split(" ");const out=[];let line="";w.forEach(x=>{if((line+" "+x).trim().length>max&&line){out.push(line);line=x}else line=(line+" "+x).trim()});if(line)out.push(line);return out}
function chart(){let axes,series;
  const all=R.series.map((s,i)=>Object.assign({},s,{i,color:COLORS[i%8]}));const vis=all.filter(s=>on.has(s.i));
  if(mode==="overview"){axes=R.axes;series=vis.map(s=>({name:s.name,color:s.color,vals:s.ov}))}
  else{const a=R.areas.find(x=>x.key===mode);axes=a.items;series=vis.map(s=>({name:s.name,color:s.color,vals:(s.det&&s.det[mode])||[]})).filter(s=>s.vals.some(v=>v!=null))}
  const ov=mode==="overview",fs=ov?28:22,lh=fs*1.1,W=640,Rr=ov?150:135,cx=W/2,cy=Rr+(ov?95:110),H=cy*2,n=axes.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*Rr*v/10,cy+Math.sin(a)*Rr*v/10]};
  let g="";
  for(let l=2;l<=10;l+=2){g+=`<polygon points="${axes.map((_,i)=>pt(i,l).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`;const[x,y]=pt(0,l);g+=`<text x="${x+4}" y="${y+4}" font-size="16" fill="var(--muted)">${l}</text>`}
  axes.forEach((ax,i)=>{const[x,y]=pt(i,10);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;const[lx,ly]=pt(i,ov?11.4:11.3);const an=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";const w=wrap(ax,ov?11:13);
    g+=`<text x="${lx}" y="${ly-(w.length-1)*lh/2+fs*.35}" text-anchor="${an}" font-size="${fs}" font-weight="600" fill="var(--fg)">${w.map((t,j)=>`<tspan x="${lx}" dy="${j?lh:0}">${esc(t)}</tspan>`).join("")}</text>`});
  series.forEach(s=>{const p=s.vals.map((v,i)=>pt(i,v??0));g+=`<polygon points="${p.map(q=>q.join(",")).join(" ")}" fill="${s.color}" fill-opacity=".14" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;p.forEach((q,i)=>{if(s.vals[i]!=null)g+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${s.color}"/>`})});
  const svg=`<svg viewBox="-70 0 780 ${H}" role="img" aria-label="Spider chart of your ratings out of 10">${g}</svg>`;
  const leg=`<div><div class="note" style="margin-bottom:6px">Tap an assessment to show or hide it on the chart.</div><div class="legend">${all.map(s=>`<button type="button" class="lg" data-s="${s.i}" aria-pressed="${on.has(s.i)}"><i style="background:${on.has(s.i)?s.color:"transparent"};border:2px solid ${s.color}"></i>${esc(s.name)}</button>`).join("")}</div></div>`;
  const tbl=!series.length?`<p class="note" style="text-align:center;margin:0">Tick an assessment above to draw it.</p>`:`<table><thead><tr><th>Skill</th>${series.map(s=>`<th class="n" style="color:${s.color}">${esc(s.name.split(" · ")[0])}</th>`).join("")}</tr></thead><tbody>${axes.map((a,i)=>`<tr><td>${esc(a)}</td>${series.map(s=>`<td class="n">${s.vals[i]==null?"–":(+s.vals[i]).toFixed(mode==="overview"?1:0)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  return leg+svg+tbl}
function authCard(){const t=auth.tab;
  if(auth.recovery)return `<section class="card"><h3>Set a new password</h3><form class="q" data-form="newpw"><label class="f" for="a-pw">New password (at least 8 characters)<input id="a-pw" type="password" autocomplete="new-password" required minlength="8"></label>${auth.msg?`<div class="alert">${esc(auth.msg)}</div>`:""}<button class="btn primary" type="submit" ${auth.busy?"disabled":""}>Save password</button></form></section>`;
  const tabs=[["in","Sign in"],["up","Create account"],["reset","Forgot password"]];
  return `<div><h2>Your development plan</h2><p class="lead">Sign in to see your spider chart, goals and training sessions.</p></div>
  <section class="card"><div class="tabs">${tabs.map(([k,l])=>`<button type="button" data-tab="${k}" aria-pressed="${k===t}">${l}</button>`).join("")}</div>
  <form class="q" data-form="${t}">
   ${t==="up"?`<p class="note" style="margin:0">Use the email address your coach gave access to.</p>`:""}
   <label class="f" for="a-email">Email<input id="a-email" type="email" autocomplete="email" required value="${esc(auth.email||"")}"></label>
   ${t!=="reset"?`<label class="f" for="a-pw">${t==="up"?"Choose a password (at least 8 characters)":"Password"}<input id="a-pw" type="password" autocomplete="${t==="up"?"new-password":"current-password"}" required ${t==="up"?'minlength="8"':""}></label>`:""}
   ${auth.msg?`<div class="${auth.ok?"good":"alert"}">${esc(auth.msg)}</div>`:""}
   <button class="btn primary" type="submit" ${auth.busy?"disabled":""}>${auth.busy?"Please wait…":t==="in"?"Sign in":t==="up"?"Create account":"Email me a reset link"}</button>
  </form></section>
  <p class="note">Your coach controls who can sign in. If your email isn't accepted, ask your coach to add it.</p>`}
function whoBar(){return user?`<div class="nav" style="margin:0;align-items:center"><span class="note">Signed in as ${esc(user.email)}</span><button class="btn" type="button" data-auth="out" style="padding:6px 12px">Sign out</button></div>`:""}
function render(){
  if(authMode&&!user||authMode&&auth.recovery){app.innerHTML=authCard();return}
  if(authMode&&!R){app.innerHTML=whoBar()+(auth.coach?`<section class="card"><h3>You're signed in as a coach</h3><p style="margin:0">Players see their plans here. <a href="index.html">Open the coach dashboard</a>.</p></section>`:`<section class="card"><h3>Nothing to show yet</h3><p style="margin:0">Your account works, but your coach hasn't linked it to a player yet (or has removed access). Ask your coach to check the email they added.</p></section>`);return}
  if(!R){app.innerHTML=`<h2>This link isn't working</h2><p class="lead">Ask your coach to send you a new link.</p>`;return}
  const tabs=[["overview","Overview"],...R.areas.map(a=>[a.key,a.name])];
  let h=whoBar()+(plans.length>1?`<div class="tabs">${plans.map(p=>`<button type="button" data-pid="${esc(p.id)}" aria-pressed="${p.id===pid}">${esc((p.report&&p.report.first)||"Player")}</button>`).join("")}</div>`:"")+`<div><h2>${esc(R.first?R.first+"'s":"My")} development plan</h2><p class="lead">${esc([R.squad,R.ageGroup].filter(Boolean).join(" · "))}${R.updated?" · updated "+esc(fmt(R.updated)):""}</p></div>`;
  if(R.note)h+=`<section class="card"><h3>From your coach</h3><p style="margin:0;white-space:pre-wrap">${esc(R.note)}</p></section>`;
  if(R.series.length){h+=`<section class="card"><h3>Your skills</h3><p class="note" style="margin:0">Ratings out of 10. "You" is your own rating, "Coach" is your coach's.</p><div class="tabs">${tabs.map(([k,l])=>`<button type="button" data-m="${esc(k)}" aria-pressed="${k===mode}">${esc(l)}</button>`).join("")}</div>${chart()}</section>`}
  if(R.strengths.length||R.work.length)h+=`<section class="card"><h3>Where you are now</h3>${R.strengths.length?`<div class="good"><b>Strengths to build on:</b> ${R.strengths.map(esc).join(", ")}</div>`:""}${R.work.length?`<div class="alert"><b>Areas to work on:</b> ${R.work.map(esc).join(", ")}</div>`:""}</section>`;
  if(R.goals.length)h+=`<section class="card"><h3>Your goals</h3>${R.goals.map((g,i)=>`<div class="goal"><div><span class="pill">Goal ${g.n||i+1}${g.corner?" · "+esc(g.corner):""}</span> ${g.status?`<span class="pill">${esc(g.status)}</span>`:""}</div><b>${esc(g.goal)}</b>${g.measure?`<div class="note">How we'll know: ${esc(g.measure)}</div>`:""}${g.target?`<div class="note">Target date: ${esc(fmt(g.target))}</div>`:""}${g.actions.length?`<ul class="acts">${g.actions.map(a=>`<li><span class="tick">${a.done?"✓":"○"}</span><span>${esc(a.text)}${a.owner?` <span class="note">(${esc(a.owner)}${a.due?", by "+esc(fmt(a.due)):""})</span>`:""}</span></li>`).join("")}</ul>`:""}</div>`).join("")}</section>`;
  h+=sessionsCard();
  if(R.nextReview)h+=`<section class="card"><h3>Next review</h3><p style="margin:0">${esc(fmt(R.nextReview))}</p></section>`;
  h+=profileCard();
  h+=`<p class="note">This page is just for you. Please don't share the link. Talk to your coach if anything here doesn't look right.</p>`;
  app.innerHTML=h}
app.addEventListener("click",async e=>{const b=e.target.closest("[data-m]");if(b){mode=b.dataset.m;render();return}
  const lg=e.target.closest("[data-s]");if(lg){const i=+lg.dataset.s;if(on.has(i))on.delete(i);else on.add(i);render();return}
  const p=e.target.closest("[data-pa]");if(!p)return;const act=p.dataset.pa;msg="";
  if(act==="edit"){draft={profile:JSON.parse(JSON.stringify(R.profile||{})),health:""};draft.profile.fmt=draft.profile.fmt||{};editing=true;render();document.getElementById("prof").scrollIntoView({block:"start"})}
  else if(act==="cancel"){editing=false;render();document.getElementById("prof").scrollIntoView({block:"start"})}
  else if(act==="save"){saving=true;render();
    const pl={kind:"profile",profile:draft.profile,health:draft.health||""};const{data,error}=authMode?await sb.rpc("update_my_profile",{pid,payload:pl}):await sb.rpc("update_profile",{code,payload:pl});saving=false;
    if(error||data!==true){msg="That didn't save. Check your signal and try again.";render();return}
    R.profile=draft.profile;editing=false;msg="Saved. Your coach can see your changes.";render();document.getElementById("prof").scrollIntoView({block:"start"})}});
app.addEventListener("input",e=>{if(!draft)return;const t=e.target;if(t.dataset.pk){draft.profile[t.dataset.pk]=t.value;if(t.dataset.pk==="bowlArm")render()}else if(t.dataset.fmt){draft.profile.fmt[t.dataset.fmt]=t.checked}else if(t.dataset.health)draft.health=t.value});
function useReport(rep){R=rep;mode="overview";editing=false;msg="";
  if(R){R.series=R.series||[];R.areas=R.areas||[];R.axes=R.axes||[];R.goals=R.goals||[];{const last=by=>{let k=-1;R.series.forEach((s,i)=>{if((s.by||(/^Coach/.test(s.name)?"coach":"self"))===by)k=i});return k};on=new Set([last("self"),last("coach")].filter(i=>i>=0));if(!on.size&&R.series.length)on.add(R.series.length-1)}R.sessions=R.sessions||[];R.profile=R.profile||{};R.strengths=R.strengths||[];R.work=R.work||[]}}
async function loadPlans(){const{data,error}=await sb.rpc("my_plans");if(error){console.warn(error);plans=[]}else plans=data||[];
  if(!plans.length){const c=await sb.rpc("is_coach");auth.coach=!c.error&&c.data===true}
  const keep=plans.find(p=>p.id===pid)||plans[0];pid=keep?keep.id:null;useReport(keep?keep.report:null);render()}
app.addEventListener("click",async e=>{const t=e.target.closest("[data-tab]");if(t){auth.tab=t.dataset.tab;auth.msg="";auth.email=(document.getElementById("a-email")||{}).value||auth.email;render();return}
  const p=e.target.closest("[data-pid]");if(p){pid=p.dataset.pid;useReport((plans.find(x=>x.id===pid)||{}).report||null);render();return}
  if(e.target.closest("[data-auth=out]")){await sb.auth.signOut();user=null;R=null;plans=[];render()}});
app.addEventListener("submit",async e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const kind=f.dataset.form;
  const em=((document.getElementById("a-email")||{}).value||"").trim().toLowerCase(),pw=(document.getElementById("a-pw")||{}).value||"";auth.email=em;auth.busy=true;auth.msg="";auth.ok=false;render();let res;
  try{
   if(kind==="in"){res=await sb.auth.signInWithPassword({email:em,password:pw});if(res.error)auth.msg=/confirm/i.test(res.error.message)?"Please confirm your email first. Check your inbox for the link we sent.":"Email or password not recognised. Try again, or use Forgot password.";}
   else if(kind==="up"){res=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:here()}});
     if(res.error)console.warn("signUp",res.error),auth.msg=/database error|not been given access/i.test(res.error.message)?"This email hasn't been given access yet. Ask your coach to add it, then try again. ("+res.error.message+")":/registered|exists/i.test(res.error.message)?"There's already an account for this email. Use Sign in, or Forgot password.":"That didn't work: "+res.error.message;
     else if(!res.data.session){auth.ok=true;auth.msg="Nearly done. We've sent you an email: tap the link in it to confirm, then come back here and sign in.";auth.tab="in"}}
   else if(kind==="reset"){res=await sb.auth.resetPasswordForEmail(em,{redirectTo:here()});auth.ok=!res.error;auth.msg=res.error?"That didn't work: "+res.error.message:"If that email has an account, we've sent a link to reset the password.";}
   else if(kind==="newpw"){res=await sb.auth.updateUser({password:pw});if(res.error)auth.msg="That didn't work: "+res.error.message;else{auth.recovery=false;auth.msg=""}}
  }catch(err){auth.msg="Something went wrong. Check your signal and try again."}
  auth.busy=false;render()});
(async()=>{
  if(!sb){render();return}
  if(!authMode){if(code.length>=10){const{data,error}=await sb.rpc("get_report",{code});if(error)console.warn(error);useReport(error?null:data)}render();return}
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"){auth.recovery=true;auth.msg="";}
    const nu=session&&session.user||null;const changed=(nu&&nu.id)!==(user&&user.id);user=nu;
    if(changed&&user)setTimeout(loadPlans,0);else render()});
  app.innerHTML=`<p class="lead">Loading…</p>`;
})();
})();
</script>
